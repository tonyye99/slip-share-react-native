version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Expo SDK packages must move together, so they arrive as one PR.
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "eslint-config-expo"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
          - "@types/react"
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
