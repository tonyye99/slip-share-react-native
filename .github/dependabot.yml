version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Expo SDK packages must move together, so they arrive as one PR.
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "eslint-config-expo"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
          - "@types/react"
      minor-and-patch:
        update-types: [minor, patch]
    # Expo SDK upgrades move many packages at once, which Dependabot can't do.
    # Each SDK pins one React Native minor, so its minor bumps are SDK changes too.
    # Upgrade the SDK by hand with `npx expo install expo@^<next> --fix`.
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # eslint-config-expo's plugins don't load on ESLint 10 or TypeScript 7 yet
      # (#13, #23). Take these majors with the SDK upgrade that supports them.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
